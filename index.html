function grade(questions,answers){
 const rows=questions.map(q=>({id:q.id,category:q.category,answered:Number.isInteger(answers[q.id]),correct:answers[q.id]===q.answer}));
 return {correct:rows.filter(r=>r.correct).length,total:rows.length,unanswered:rows.filter(r=>!r.answered).length,categories:Object.fromEntries([...new Set(rows.map(r=>r.category))].map(c=>[c,{correct:rows.filter(r=>r.category===c&&r.correct).length,total:rows.filter(r=>r.category===c).length}]))};
}
function remainingSeconds(deadline,now=Date.now()){return Math.max(0,Math.ceil((deadline-now)/1000));}
function validSession(s,lessons){
 const lesson=lessons.find(l=>l.id===s?.lessonId);
 return !!(lesson&&['practice','timed'].includes(s.mode)&&Number.isInteger(s.index)&&s.index>=0&&s.index<lesson.questions.length&&s.answers&&typeof s.answers==='object'&&Object.entries(s.answers).every(([id,v])=>lesson.questions.some(q=>q.id===id&&Number.isInteger(v)&&v>=0&&v<q.options.length))&&Number.isFinite(s.startedAt)&&(s.mode!=='timed'||Number.isFinite(s.deadline)));
}

// Isolate equations so Hebrew directionality cannot reverse an inequality.
function mathText(value){
 const text=String(value??'');
 const pattern=/[0-9□●▲■○△★☆◆⬟]+(?:[ \t]*[+−\-×÷=<>][ \t]*[0-9□●▲■○△★☆◆⬟]+)+/g;
 let out='',end=0;
 for(const match of text.matchAll(pattern)){out+=esc(text.slice(end,match.index))+'<bdi dir="ltr">'+esc(match[0])+'</bdi>';end=match.index+match[0].length;}
 return out+esc(text.slice(end));
}

function home(){const done=new Set(state.history.map(h=>h.lessonId));shell(`<section class="hero"><div><div class="eyebrow">המסלול של אמיקה · מחוננים שלב א׳</div><h1>סקרנות קטנה.<br><span>מחשבות גדולות.</span></h1><p>קוראים, מגלים ומפצחים יחד. מסלול תרגול לכיתה ב׳ שמתחיל בצעדים קטנים, ובונה ביטחון בכל שאלה.</p><button class="primary" data-action="first">בואו נתחיל לגלות <span>←</span></button><div class="hero-note">בקצב שלך, עם הסבר לכל תשובה.</div></div>${art()}</section><div class="stats"><span><b>${lessons.length}</b> יחידות מדורגות</span><span class="divider"></span><span><b>${count()}</b> שאלות מקוריות</span><span class="divider"></span><span><b>2</b> תחומי חשיבה</span><span class="divider"></span><span>עם שעון או בלעדיו</span></div>${state.session?`<div class="resume"><div><strong>נמשיך מהמקום שבו עצרנו?</strong><p>${esc(lessons.find(l=>l.id===state.session.lessonId).title)} · ${Object.keys(state.session.answers).length} תשובות נשמרו${state.session.mode==='timed'?' · השעון ממשיך לרוץ':''}</p></div><button class="primary" data-action="resume">להמשיך ←</button></div>`:''}<section><div class="section-head"><div><h2>דרך קטנה, התקדמות גדולה</h2><p>מתחילים מהיכרות, ומתקדמים בהדרגה לאתגר הבא.</p></div><button class="text-btn" data-action="method">איך לומדים כאן?</button></div><div class="lesson-grid">${lessons.map((l,i)=>`<article class="lesson-card"><div class="card-top"><span class="lesson-icon" aria-hidden="true">${icons[i%icons.length]}</span><span class="level"><span class="level-bars" aria-hidden="true">${Array.from({length:6},(_,j)=>`<i class="${j<Math.min(l.level,6)?'on':''}" style="height:${4+j}px"></i>`).join('')}</span>${l.questions.length===26?'תרגול מסכם':l.level<=2?'צעדים ראשונים':l.level<=4?'מעמיקים':'עולים לאתגר'}</span></div><div class="lesson-number">יחידה ${String(i+1).padStart(2,'0')}</div><h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p><div class="meta"><span>◷ ${l.minutes} דק׳ לתרגול</span><span>▤ ${l.questions.length} שאלות</span></div><div class="card-footer"><button class="primary" data-action="lesson" data-id="${l.id}">${done.has(l.id)?'מתרגלים שוב':'ליחידת התרגול'} <span>←</span></button><span class="completion">${done.has(l.id)?'✓ הושלמה':l.questions.length===26?'באורך הדוגמה שנבדקה':'יחידה מקוצרת'}</span></div></article>`).join('')}</div></section><aside class="path-note"><span aria-hidden="true">☀</span><div><strong>קודם מבינים. אחר כך מתרגלים עם שעון.</strong><p>אפשר להתחיל ללא הגבלת זמן, ולנסות תרגול קצוב כשמרגישים מוכנים. זמני התרגול הם המלצה שלנו; הם אינם זמן רשמי של משרד החינוך.</p></div></aside>`);}

function setup(){const l=selected;shell(`<button class="text-btn no-print" data-action="home" style="margin-top:30px">→ חזרה למסלול</button><div class="eyebrow" style="margin-top:28px">יחידה ${lessons.indexOf(l)+1} · ${l.questions.length} שאלות</div><h1 class="page-title">${esc(l.title)}</h1><p class="lead">${esc(l.subtitle)}</p><section class="panel"><h2>איך נתרגל היום?</h2><div class="mode-grid"><button class="mode ${mode==='practice'?'selected':''}" data-action="mode" data-mode="practice" aria-pressed="${mode==='practice'}"><strong>☀ לומדים בנחת</strong><span>בלי שעון. אפשר לחזור לכל שאלה. הפתרונות בסיום.</span></button><button class="mode ${mode==='timed'?'selected':''}" data-action="mode" data-mode="timed" aria-pressed="${mode==='timed'}"><strong>◷ מתאמנים עם שעון</strong><span>${l.minutes} דקות לתרגול. כשהזמן נגמר, התשובות נשלחות אוטומטית.</span></button></div><p class="notice">${l.questions.length===26?'תרגול באורך הדוגמה שנבדקה, בשאלות מקוריות.':'זו יחידת תרגול מקוצרת, ולא מבחן מלא.'} כל השאלות כאן הן רב־ברירה; בדוגמה הרשמית יש גם תשובות פתוחות. זמני התרגול אינם זמנים רשמיים.</p><div class="actions"><button class="primary" data-action="start">מתחילים לתרגל ←</button><button class="secondary" data-action="worksheet">דף עבודה להדפסה</button></div></section><section class="panel"><h2>לומדים יחד · מדריך למלווה</h2>${guide(l)}</section>`);}

function session(){const s=state.session;if(!s){view='home';render();return;}const l=lessons.find(l=>l.id===s.lessonId),q=l.questions[s.index];shell(`<div class="workspace" style="padding-inline:0"><div class="session-top"><button class="text-btn" data-action="leave">→ שמירה וחזרה למסלול</button><span>${esc(l.title)}</span><span class="timer" id="timer" role="timer" aria-label="זמן שנותר">${s.mode==='timed'?timeLabel(remainingSeconds(s.deadline)):'ללא שעון'}</span></div><div class="progress-track" aria-label="${Object.keys(s.answers).length} מתוך ${l.questions.length} נענו"><div style="width:${100*Object.keys(s.answers).length/l.questions.length}%"></div></div><div class="question-layout"><section class="question-panel"><div class="question-type">${labels[q.category]} · שאלה ${s.index+1} מתוך ${l.questions.length}</div>${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}<h1 id="question-title" tabindex="-1" class="math">${mathText(q.prompt)}</h1><div class="options" role="group" aria-labelledby="question-title">${q.options.map((o,i)=>`<button class="option ${s.answers[q.id]===i?'selected':''}" data-action="answer" data-value="${i}" aria-pressed="${s.answers[q.id]===i}"><span class="letter">${'אבגד'[i]}</span><span class="math">${mathText(o)}</span></button>`).join('')}</div><div class="question-actions"><button class="secondary" data-action="previous" ${s.index===0?'disabled':''}>→ הקודמת</button>${s.index===l.questions.length-1?'<button class="primary" data-action="submit">סיום ובדיקת תשובות</button>':'<button class="primary" data-action="next">לשאלה הבאה ←</button>'}</div></section><aside class="question-aside"><h2 class="sidebar-title">מפת השאלות</h2><div class="question-map">${l.questions.map((x,i)=>`<button aria-label="שאלה ${i+1}${s.answers[x.id]!==undefined?' נענתה':''}" ${i===s.index?'aria-current="step"':''} class="${i===s.index?'current':''} ${s.answers[x.id]!==undefined?'answered':''}" data-action="jump" data-value="${i}">${i+1}</button>`).join('')}</div><p class="sidebar-note">אפשר לדלג ולחזור אחר כך.<br>כל תשובה נשמרת במכשיר הזה.${s.mode==='timed'?'<br>השעון ממשיך גם ביציאה מהעמוד.':''}</p><button class="text-btn" data-action="submit" style="margin-top:18px">סיום התרגול</button></aside></div></div>`);if(s.mode==='timed'){tick();if(state.session)timer=setInterval(tick,500);}}
function tick(){if(!state.session||state.session.mode!=='timed')return;const left=remainingSeconds(state.session.deadline),el=document.querySelector('#timer');if(el){el.textContent=timeLabel(left);el.classList.toggle('urgent',left<120);}if(left===0){document.querySelector('dialog')?.close();finish(true);}}

function reviewItems(l,answers){return l.questions.map((q,i)=>`<article class="review-item">${q.passage&&(i===0||q.passage!==l.questions[i-1].passage)?`<div class="passage">${esc(q.passage)}</div>`:''}<span class="status ${answers[q.id]===undefined?'empty':answers[q.id]===q.answer?'':'wrong'}">${answers[q.id]===undefined?'לא נענתה':answers[q.id]===q.answer?'תשובה נכונה':'ננסה להבין יחד'}</span><h3 class="math">${i+1}. ${mathText(q.prompt)}</h3><p>התשובה שלך: <b class="math">${answers[q.id]===undefined?'לא סומנה תשובה':mathText(q.options[answers[q.id]])}</b><br>התשובה הנכונה: <b class="math">${mathText(q.options[q.answer])}</b></p><p class="math">${mathText(q.explanation)}</p></article>`).join('');}
function results(){if(!result){view='home';render();return;}const l=lessons.find(l=>l.id===result.lessonId);shell(`<section class="score"><div class="eyebrow" style="justify-content:center">${esc(l.title)} · סיכום התרגול</div><h1>${result.expired?'הזמן הסתיים. בואו נראה מה גילינו.':'עוד צעד בדרך שלך ✦'}</h1><div class="score-number">${result.correct}<small> / ${result.total}</small></div><p>תשובות נכונות · ${result.unanswered} שאלות שלא נענו<br>זהו משוב ללמידה, ולא תחזית לציון במבחן המחוננים.</p><div class="actions" style="justify-content:center"><button class="primary" data-action="home">בחזרה למסלול ←</button><button class="secondary" data-action="retry" data-id="${l.id}">מתרגלים שוב</button></div></section><div class="category-results" style="grid-template-columns:repeat(${Object.keys(result.categories).length},1fr)">${Object.entries(result.categories).map(([c,r])=>`<div class="category-result">${labels[c]}<b>${r.correct} / ${r.total}</b></div>`).join('')}</div><section class="panel"><h2>מבינים את הדרך, לא רק את התשובה</h2><p class="lead">בחרו שאלה אחת שהייתה מאתגרת, וקראו יחד את ההסבר.</p>${reviewItems(l,result.answers)}</section>`);}
function progress(){shell(`<h1 class="page-title">כל צעד נשמר</h1><p class="lead">ההתקדמות נשמרת בדפדפן ובמכשיר הזה בלבד. אין צורך בחשבון.</p>${!state.history.length?'<div class="empty-state">המסע עוד לפנינו ✦<p>אחרי התרגול הראשון, התוצאות יופיעו כאן.</p><button class="primary" data-action="home">לבחירת יחידה ←</button></div>':`<div class="panel">${state.history.toReversed().map((h,i)=>`<article class="review-item"><div class="section-head" style="margin:0"><div><h3>${esc(lessons.find(l=>l.id===h.lessonId).title)}</h3><p>${new Date(h.at).toLocaleDateString('he-IL')} · ${h.mode==='timed'?'תרגול עם שעון':'ללא שעון'}${h.expired?' · הזמן הסתיים':''}</p></div><strong>${h.correct} / ${h.total}</strong></div>${h.answers?`<button class="text-btn" data-action="history" data-value="${state.history.length-1-i}">לצפייה בתשובות ובהסברים</button>`:''}</article>`).join('')}</div><button class="text-btn no-print" data-action="clear">מחיקת ההיסטוריה מהמכשיר</button>`}`);}
function worksheet(){const l=selected;shell(`<div class="no-print"><h1 class="page-title">דף העבודה שלך מוכן</h1><p class="lead">אפשר להדפיס או לשמור כ־PDF דרך חלון ההדפסה. מפתח התשובות יוצג בעמוד נפרד רק אם תבחרו לכלול אותו.</p><label><input type="checkbox" id="with-answers"> לכלול מפתח תשובות והסברים למלווה</label><div class="actions" style="margin:20px 0"><button class="primary" data-action="print">הדפסה / שמירה כ־PDF</button><button class="secondary" data-action="back-setup">בחזרה ליחידה</button></div></div><div class="print-header"><h1>אמיקה · ${esc(l.title)}</h1><p>שם: ____________ תאריך: ____________</p><p>${l.questions.length} שאלות · ${l.minutes} דקות תרגול מומלצות (לא זמן רשמי). סמנו תשובה אחת לכל שאלה.</p></div><section class="panel">${l.questions.map((q,i)=>`<article class="review-item">${q.passage&&(i===0||q.passage!==l.questions[i-1].passage)?`<div class="passage">${esc(q.passage)}</div>`:''}<h3 class="math">${i+1}. ${mathText(q.prompt)}</h3><div class="print-options">${q.options.map((o,j)=>`<span class="math">${'אבגד'[j]}. ${mathText(o)}</span>`).join('')}</div></article>`).join('')}</section><section id="print-answers" class="print-answers" hidden><h2>מפתח תשובות · למלווה</h2>${l.questions.map((q,i)=>`<article class="review-item"><strong>${i+1}. ${'אבגד'[q.answer]} — ${mathText(q.options[q.answer])}</strong><p class="math">${mathText(q.explanation)}</p></article>`).join('')}</section>`);}
function sources(){shell(`<h1 class="page-title">מאחורי כל שאלה יש מחשבה</h1><p class="lead">התרגילים והסיפורים באתר נכתבו במיוחד עבור המסלול. המבנה מבוסס על עיון בדוגמאות של שלב א׳ לכיתה ב׳, ולא על העתקת שאלות. הקושי מדורג לפי הערכה פדגוגית, ללא כיול פסיכומטרי.</p><section class="panel"><h2>מה מצאנו בדוגמאות?</h2><p class="lead">בדוגמת תשפ״ה שנבדקה: 12 שאלות הבנת הנקרא על שני טקסטים ו־14 שאלות חשבון. בחשבון מופיעים חישובים, מספר חסר ואי־שוויונים, בעיות מילוליות וחידות בציורים. זהו מבנה של דוגמה מסוימת; ייתכנו סוגי שאלות נוספים.</p><div class="notice">הגישה הישירה לאתרים הישראליים נחסמה בסביבת העבודה. הקבצים והתמלילים נקראו דרך מראת GitHub ציבורית. לא אומת שהם זהים לפרסום העדכני באתר המשרד, ולא אומת משך רשמי בדקות.</div><ul class="research-list"><li><a href="https://meyda.education.gov.il/files/Rama/gifted-students-heb-2025.pdf" target="_blank" rel="noopener noreferrer">מבחן סינון כיתה ב׳ תשפ״ה — משרד החינוך</a> · PDF, ‏13 עמודים; נקרא דרך המראה.</li><li><a href="https://meyda.education.gov.il/files/Rama/mechvan-gifted-students-heb-2025.pdf" target="_blank" rel="noopener noreferrer">מחוון תשפ״ה</a> · PDF, ‏4 עמודים; נקרא דרך המראה.</li><li><a href="https://meyda.education.gov.il/files/gifted/sinun_b-c_example_heb.pdf" target="_blank" rel="noopener noreferrer">דוגמאות רשמיות לשלב א׳</a> · PDF, ‏5 עמודים; נקרא דרך המראה.</li><li><a href="https://www.machon-noam.co.il/מחוננים-שלב-א" target="_blank" rel="noopener noreferrer">מכון נעם</a> · PDF דוגמה בן 10 עמודים דרך המראה.</li><li><a href="https://gaonchik.co.il/category/sample-questions/" target="_blank" rel="noopener noreferrer">גאונצ׳יק</a> · 27 דוגמאות בתמליל המראה.</li><li><a href="https://gaonshelima.co.il/gifted-test-example-pdf/" target="_blank" rel="noopener noreferrer">גאון של אמא</a> · 11 דוגמאות שלב א׳ בתמליל המראה.</li><li><a href="https://github.com/ShoobyD/gifted-prep/tree/54a4be9524f2e03c3112db93fb12ed19badaf6a3/resources" target="_blank" rel="noopener noreferrer">מראת החומרים שנבדקה — גרסה קבועה</a></li></ul><a class="text-btn" href="data:text/plain;charset=utf-8,%23%20%D7%9E%D7%97%D7%A7%D7%A8%20%D7%AA%D7%95%D7%9B%D7%9F%3A%20%D7%9E%D7%97%D7%95%D7%A0%D7%A0%D7%99%D7%9D%20%D7%A9%D7%9C%D7%91%20%D7%90%D7%B3%2C%20%D7%9B%D7%99%D7%AA%D7%94%20%D7%91%D7%B3%0A%0A%D7%A0%D7%91%D7%93%D7%A7%20%D7%91%D6%BE22.10.2026.%20%D7%9E%D7%98%D7%A8%D7%AA%20%D7%94%D7%9E%D7%97%D7%A7%D7%A8%3A%20%D7%9C%D7%91%D7%A0%D7%95%D7%AA%20%D7%A9%D7%90%D7%9C%D7%95%D7%AA%20%D7%9E%D7%A7%D7%95%D7%A8%D7%99%D7%95%D7%AA%20%D7%95%D7%AA%D7%95%D7%9B%D7%A0%D7%99%D7%AA%20%D7%94%D7%93%D7%A8%D7%92%D7%AA%D7%99%D7%AA%2C%20%D7%95%D7%9C%D7%90%20%D7%9C%D7%A9%D7%9B%D7%A4%D7%9C%20%D7%A9%D7%90%D7%9C%D7%95%D7%AA%20%D7%9E%D7%95%D7%92%D7%A0%D7%95%D7%AA%20%D7%90%D7%95%20%D7%9C%D7%94%D7%91%D7%98%D7%99%D7%97%20%D7%94%D7%AA%D7%90%D7%9E%D7%94%20%D7%9E%D7%93%D7%95%D7%99%D7%A7%D7%AA%20%D7%9C%D7%9E%D7%91%D7%97%D7%9F%20%D7%A2%D7%AA%D7%99%D7%93%D7%99.%0A%0A%23%23%20%D7%93%D7%A8%D7%9A%20%D7%94%D7%90%D7%99%D7%9E%D7%95%D7%AA%20%D7%95%D7%9E%D7%92%D7%91%D7%9C%D7%95%D7%AA%0A%0A%D7%94%D7%92%D7%99%D7%A9%D7%94%20%D7%94%D7%99%D7%A9%D7%99%D7%A8%D7%94%20%D7%9C%D7%9E%D7%A0%D7%95%D7%A2%D7%99%20%D7%97%D7%99%D7%A4%D7%95%D7%A9%20%D7%95%D7%9C%D7%90%D7%AA%D7%A8%D7%99%20%D7%9E%D7%A9%D7%A8%D7%93%20%D7%94%D7%97%D7%99%D7%A0%D7%95%D7%9A%20%D7%95%D7%90%D7%AA%D7%A8%D7%99%20%D7%94%D7%94%D7%9B%D7%A0%D7%94%20%D7%94%D7%95%D7%97%D7%96%D7%A8%D7%94%20%D7%A2%D7%9D%20%D7%A9%D7%92%D7%99%D7%90%D7%AA%20proxy%20CONNECT%20403.%20%D7%97%D7%99%D7%A4%D7%95%D7%A9%20%D7%A6%D7%99%D7%91%D7%95%D7%A8%D7%99%20%D7%91%D6%BEGitHub%20%D7%A2%D7%91%D7%93.%20%D7%A0%D7%9E%D7%A6%D7%90%D7%94%20%D7%9E%D7%A8%D7%90%D7%AA%20%D7%97%D7%95%D7%9E%D7%A8%D7%99%20%D7%94%D7%9B%D7%A0%D7%94%3A%20https%3A%2F%2Fgithub.com%2FShoobyD%2Fgifted-prep%2Ftree%2F54a4be9524f2e03c3112db93fb12ed19badaf6a3%2Fresources%20.%20%D7%A7%D7%95%D7%91%D7%A6%D7%99%20%D7%94%D6%BEPDF%20%D7%94%D7%9E%D7%99%D7%95%D7%97%D7%A1%D7%99%D7%9D%20%D7%9C%D7%9E%D7%A9%D7%A8%D7%93%20%D7%94%D7%97%D7%99%D7%A0%D7%95%D7%9A%20%D7%95%D7%9C%D7%9E%D7%9B%D7%95% ודה; תשובה שגויה או ריקה אינה מקבלת נקודה.</p></div></div><p class="lead">היחידות הקצרות הן תרגול מקוצר. התרגול בן 26 השאלות תואם את אורך הדוגמה שנבדקה, אך גם בו כל השאלות הותאמו לרב־ברירה. זמני התרגול הם המלצה שלנו, ואינם משך המבחן הרשמי. אין כאן תחזית מעבר או אבחון.</p></section>`);}
function method(){shell(`<h1 class="page-title">לומדים לחשוב, צעד אחר צעד</h1><p class="lead">כל יחידה היא שיעור קטן: פתיחה משותפת, תרגול עצמאי ושיחה על הדרך.</p><section class="panel"><ol class="research-list"><li><strong>מתחילים מהיכרות.</strong> מומלץ להתקדם לפי הסדר, אך כל היחידות פתוחות ואפשר לבחור לפי הצורך.</li><li><strong>לומדים בנחת.</strong> מתחילים ללא שעון. קוראים את כל האפשרויות ומחפשים הוכחה בטקסט או בחישוב.</li><li><strong>מתרגלים עצמאות.</strong> אפשר לדלג ולחזור. אין צורך לענות לפי סדר השאלות.</li><li><strong>מוסיפים שעון כשמוכנים.</strong> הזמן מומלץ לתרגול שלנו בלבד. השעון ממשיך גם כשסוגרים את העמוד, והתרגול נבדק אוטומטית כשהזמן נגמר.</li><li><strong>בודקים יחד.</strong> קוראים את ההסברים ובוחרים אסטרטגיה אחת לשיעור הבא. הציון נועד ללמידה.</li></ol><button class="primary" data-action="home">למסלול הלמידה ←</button></section>`);}

 if(a==='mode'){mode=b.dataset.mode;render(false);}
 if(a==='start')start();
 if(a==='resume'){view='session';render();}
 if(a==='leave'){save();view='home';render();}
 if(a==='answer'&&s){if(s.mode==='timed'&&remainingSeconds(s.deadline)===0){finish(true);return;}const l=lessons.find(l=>l.id===s.lessonId);s.answers[l.questions[s.index].id]=Number(b.dataset.value);save();render(false);document.querySelector(`[data-action="answer"][data-value="${b.dataset.value}"]`)?.focus({preventScroll:true});}
 if(['previous','next','jump'].includes(a)&&s){const l=lessons.find(l=>l.id===s.lessonId);s.index=a==='jump'?Number(b.dataset.value):s.index+(a==='next'?1:-1);s.index=Math.max(0,Math.min(l.questions.length-1,s.index));save();render();document.querySelector('#question-title')?.focus({preventScroll:true});}
 if(a==='submit'&&s){const l=lessons.find(l=>l.id===s.lessonId),n=l.questions.length-Object.keys(s.answers).length;confirmBox('לסיים ולבדוק את התרגול?',n?`נותרו ${n} שאלות ללא תשובה. אפשר לחזור אליהן או לסיים עכשיו.`:'ענית על כל השאלות. נפתח יחד את התשובות וההסברים?',()=>finish());}
 if(a==='worksheet'){view='print';render();}
 if(a==='back-setup'){view='setup';render();}
 if(a==='print'){document.querySelector('#print-answers').hidden=!document.querySelector('#with-answers').checked;window.print();}
 if(a==='clear')confirmBox('למחוק את היסטוריית התרגול?','המחיקה חלה על המכשיר הזה ולא ניתן לבטל אותה. תרגול שטרם הוגש לא יימחק.',()=>{state.history=[];save();render();});
 if(a==='history'){const h=state.history[Number(b.dataset.value)],l=lessons.find(l=>l.id===h.lessonId);result={...h,...grade(l.questions,h.answers),unanswered:l.questions.length-Object.keys(h.answers).length};view='result';render();}
});
render();
