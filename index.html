function grade(questions,answers){
 const rows=questions.map(q=>({id:q.id,category:q.category,answered:Number.isInteger(answers[q.id]),correct:answers[q.id]===q.answer}));
 return {correct:rows.filter(r=>r.correct).length,total:rows.length,unanswered:rows.filter(r=>!r.answered).length,categories:Object.fromEntries([...new Set(rows.map(r=>r.category))].map(c=>[c,{correct:rows.filter(r=>r.category===c&&r.correct).length,total:rows.filter(r=>r.category===c).length}]))};
}
function remainingSeconds(deadline,now=Date.now()){return Math.max(0,Math.ceil((deadline-now)/1000));}
function validSession(s,lessons){
 const lesson=lessons.find(l=>l.id===s?.lessonId);
 return !!(lesson&&['practice','timed'].includes(s.mode)&&Number.isInteger(s.index)&&s.index>=0&&s.index<lesson.questions.length&&s.answers&&typeof s.answers==='object'&&Object.entries(s.answers).every(([id,v])=>lesson.questions.some(q=>q.id===id&&Number.isInteger(v)&&v>=0&&v<q.options.length))&&Number.isFinite(s.startedAt)&&(s.mode!=='timed'||Number.isFinite(s.deadline)));
}

function mathText(value){
 const text=String(value??'');
 const pattern=/[0-9□●▲■○△★☆◆⬟]+(?:[ \t]*[+−\-×÷=<>][ \t]*[0-9□●▲■○△★☆◆⬟]+)+/g;
 let out='',end=0;
 for(const match of text.matchAll(pattern)){out+=esc(text.slice(end,match.index))+'<bdi dir="ltr">'+esc(match[0])+'</bdi>';end=match.index+match[0].length;}
 return out+esc(text.slice(end));
}

<=4?'מַעֲמִיקִים':'עוֹלִים לָאֶתְגָּר'}</span></div><div class="lesson-number">יְחִידָה ${String(i+1).padStart(2,'0')}</div><h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p><div class="meta"><span>◷ ${l.minutes} דַּקּוֹת לְתִרְגּוּל</span><span>▤ ${l.questions.length} שְׁאֵלוֹת</span></div><div class="card-footer"><button class="primary" data-action="lesson" data-id="${l.id}">${done.has(l.id)?'מְתַרְגְּלִים שׁוּב':'לִיחִידַת הַתִּרְגּוּל'} <span>←</span></button><span class="completion">${done.has(l.id)?'✓ הֻשְׁלְמָה':l.questions.length===26?'בְּאוֹרֶךְ הַדֻּגְמָה שֶׁנִּבְדְּקָה':'יְחִידָה מְקֻצֶּרֶת'}</span></div></article>`).join('')}</div></section><aside class="path-note"><span aria-hidden="true">☀</span><div><strong>קוֹדֶם מְבִינִים. אַחַר כָּךְ מְתַרְגְּלִים עִם שָׁעוֹן.</strong><p>אֶפְשָׁר לְהַתְחִיל לְלֹא הַגְבָּלַת זְמַן, וּלְנַסּוֹת תִּרְגּוּל קָצוּב כְּשֶׁמַּרְגִּישִׁים מוּכָנִים. זְמַנֵּי הַתִּרְגּוּל הֵם הַמְלָצָה שֶׁלָּנוּ; הֵם אֵינָם זְמַן רִשְׁמִי שֶׁל מִשְׂרַד הַחִנּוּךְ.</p></div></aside>`);}
function guide(l){const g=l.teacherGuide;return `<div class="guide-grid">${[['מַטְּרַת הַשִּׁעוּר',g.goal],['פּוֹתְחִים יַחַד · כְּ־3 דַּקּוֹת',g.warmup],['אֶסְטְרָטֶגְיָה לְתִרְגּוּל',g.strategy],['מְסַיְּמִים בְּשִׂיחָה · כְּ־5 דַּקּוֹת',g.wrapup]].map(([a,b])=>`<div><strong>${a}</strong><p>${esc(b)}</p></div>`).join('')}</div>`;}
function setup(){const l=selected;shell(`<button class="text-btn no-print" data-action="home" style="margin-top:30px">→ חֲזָרָה לַמַּסְלוּל</button><div class="eyebrow" style="margin-top:28px">יְחִידָה ${lessons.indexOf(l)+1} · ${l.questions.length} שְׁאֵלוֹת</div><h1 class="page-title">${esc(l.title)}</h1><p class="lead">${esc(l.subtitle)}</p><section class="panel"><h2>אֵיךְ נְתַרְגֵּל הַיּוֹם?</h2><div class="mode-grid"><button class="mode ${mode==='practice'?'selected':''}" data-action="mode" data-mode="practice" aria-pressed="${mode==='practice'}"><strong>☀ לוֹמְדִים בְּנַחַת</strong><span>בְּלִי שָׁעוֹן. אֶפְשָׁר לַחֲזוֹר לְכָל שְׁאֵלָה. הַפִּתְרוֹנוֹת בַּסִּיּוּם.</span></button><button class="mode ${mode==='timed'?'selected':''}" data-action="mode" data-mode="timed" aria-pressed="${mode==='timed'}"><strong>◷ מִתְאַמְּנִים עִם שָׁעוֹן</strong><span>${l.minutes} דַּקּוֹת לְתִרְגּוּל. כְּשֶׁהַזְּמַן נִגְמָר, הַתְּשׁוּבוֹת נִשְׁלָחוֹת אוֹטוֹמָטִית.</span></button></div><p class="notice">${l.questions.length===26?'תִּרְגּוּל בְּאוֹרֶךְ הַדֻּגְמָה שֶׁנִּבְדְּקָה, בִּשְׁאֵלוֹת מְקוֹרִיּוֹת.':'זוֹ יְחִידַת תִּרְגּוּל מְקֻצֶּרֶת, וְלֹא מִבְחָן מָלֵא.'} כָּל הַשְּׁאֵלוֹת כָּאן הֵן רַב־בְּרֵרָה; בַּדֻּגְמָה הָרִשְׁמִית יֵשׁ גַּם תְּשׁוּבוֹת פְּתוּחוֹת. זְמַנֵּי הַתִּרְגּוּל אֵינָם זְמַנִּים רִשְׁמִיִּים.</p><div class="actions"><button class="primary" data-action="start">מַתְחִילִים לְתַרְגֵּל ←</button><button class="secondary" data-action="worksheet">דַּף עֲבוֹדָה לְהַדְפָּסָה</button></div></section><section class="panel"><h2>לוֹמְדִים יַחַד · מַדְרִיךְ לַמְּלַוֶּה</h2>${guide(l)}</section>`);}
function start(){const go=()=>{state.session={lessonId:selected.id,mode,index:0,answers:{},startedAt:Date.now(),deadline:mode==='timed'?Date.now()+selected.minutes*60000:null};save();view='session';render();};if(state.session)confirmBox('לְהַתְחִיל תִּרְגּוּל חָדָשׁ?','הַתִּרְגּוּל הַקּוֹדֵם שֶׁעֲדַיִן לֹא הֻגַּשׁ יֻחְלַף. תּוֹצָאוֹת שֶׁכְּבָר הֻשְׁלְמוּ יִשָּׁמְרוּ.',go);else go();}
function session(){const s=state.session;if(!s){view='home';render();return;}const l=lessons.find(l=>l.id===s.lessonId),q=l.questions[s.index];shell(`<div class="workspace" style="padding-inline:0"><div class="session-top"><button class="text-btn" data-action="leave">→ שְׁמִירָה וַחֲזָרָה לַמַּסְלוּל</button><span>${esc(l.title)}</span><span class="timer" id="timer" role="timer" aria-label="זְמַן שֶׁנּוֹתַר">${s.mode==='timed'?timeLabel(remainingSeconds(s.deadline)):'לְלֹא שָׁעוֹן'}</span></div><div class="progress-track" aria-label="${Object.keys(s.answers).length} מִתּוֹךְ ${l.questions.length} נַעֲנוּ"><div style="width:${100*Object.keys(s.answers).length/l.questions.length}%"></div></div><div class="question-layout"><section class="question-panel"><div class="question-type">${labels[q.category]} · שְׁאֵלָה ${s.index+1} מִתּוֹךְ ${l.questions.length}</div>${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}<h1 id="question-title" tabindex="-1" class="math">${mathText(q.prompt)}</h1><div class="options" role="group" aria-labelledby="question-title">${q.options.map((o,i)=>`<button class="option ${s.answers[q.id]===i?'selected':''}" data-action="answer" data-value="${i}" aria-pressed="${s.answers[q.id]===i}"><span class="letter">${'אבגד'[i]}</span><span class="math">${mathText(o)}</span></button>`).join('')}</div><div class="question-actions"><button class="secondary" data-action="previous" ${s.index===0?'disabled':''}>→ הַקּוֹדֶמֶת</button>${s.index===l.questions.length-1?'<button class="primary" data-action="submit">סִיּוּם וּבְדִיקַת תְּשׁוּבוֹת</button>':'<button class="primary" data-action="next">לַשְּׁאֵלָה הַבָּאָה ←</button>'}</div></section><aside class="question-aside"><h2 class="sidebar-title">מַפַּת הַשְּׁאֵלוֹת</h2><div class="question-map">${l.questions.map((x,i)=>`<button aria-label="שְׁאֵלָה ${i+1}${s.answers[x.id]!==undefined?' נַעֲנְתָה':''}" ${i===s.index?'aria-current="step"':''} class="${i===s.index?'current':''} ${s.answers[x.id]!==undefined?'answered':''}" data-action="jump" data-value="${i}">${i+1}</button>`).join('')}</div><p class="sidebar-note">אֶפְשָׁר לְדַלֵּג וְלַחֲזוֹר אַחַר כָּךְ.<br>כָּל תְּשׁוּבָה נִשְׁמֶרֶת בַּמַּכְשִׁיר הַזֶּה.${s.mode==='timed'?'<br>הַשָּׁעוֹן מַמְשִׁיךְ גַּם בַּיְּצִיאָה מֵהָעַמּוּד.':''}</p><button class="text-btn" data-action="submit" style="margin-top:18px">סִיּוּם הַתִּרְגּוּל</button></aside></div></div>`);if(s.mode==='timed'){tick();if(state.session)timer=setInterval(tick,500);}}
function tick(){if(!state.session||state.session.mode!=='timed')return;const left=remainingSeconds(state.session.deadline),el=document.querySelector('#timer');if(el){el.textContent=timeLabel(left);el.classList.toggle('urgent',left<120);}if(left===0){document.querySelector('dialog')?.close();finish(true);}}
function finish(expired=false){if(!state.session)return;const s=state.session,l=lessons.find(l=>l.id===s.lessonId);result={...s,...grade(l.questions,s.answers),expired,at:Date.now()};state.history.push({lessonId:l.id,answers:{...s.answers},correct:result.correct,total:result.total,at:result.at,mode:s.mode,expired});state.session=null;save();view='result';render();}
function reviewItems(l,answers){return l.questions.map((q,i)=>`<article class="review-item">${q.passage&&(i===0||q.passage!==l.questions[i-1].passage)?`<div class="passage">${esc(q.passage)}</div>`:''}<span class="status ${answers[q.id]===undefined?'empty':answers[q.id]===q.answer?'':'wrong'}">${answers[q.id]===undefined?'לֹא נַעֲנְתָה':answers[q.id]===q.answer?'תְּשׁוּבָה נְכוֹנָה':'נְנַסֶּה לְהָבִין יַחַד'}</span><h3 class="math">${i+1}. ${mathText(q.prompt)}</h3><p>הַתְּשׁוּבָה שֶׁלָּךְ: <b class="math">${answers[q.id]===undefined?'לֹא סֻמְּנָה תְּשׁוּבָה':mathText(q.options[answers[q.id]])}</b><br>הַתְּשׁוּבָה הַנְּכוֹנָה: <b class="math">${mathText(q.options[q.answer])}</b></p><p class="math">${mathText(q.explanation)}</p></article>`).join('');}
function results(){if(!result){view='home';render();return;}const l=lessons.find(l=>l.id===result.lessonId);shell(`<section class="score"><div class="eyebrow" style="justify-content:center">${esc(l.title)} · סִכּוּם הַתִּרְגּוּל</div><h1>${result.expired?'הַזְּמַן הִסְתַּיֵּם. בּוֹאוּ נִרְאֶה מָה גִּלִּינוּ.':'עוֹד צַעַד בַּדֶּרֶךְ שֶׁלָּךְ ✦'}</h1><div class="score-number">${result.correct}<small> / ${result.total}</small></div><p>תְּשׁוּבוֹת נְכוֹנוֹת · ${result.unanswered} שְׁאֵלוֹת שֶׁלֹּא נַעֲנוּ<br>זֶהוּ מָשׁוֹב לִלְמִידָה, וְלֹא תַּחֲזִית לְצִיּוּן בְּמִבְחַן הַמְּחוֹנָנִים.</p><div class="actions" style="justify-content:center"><button class="primary" data-action="home">בַּחֲזָרָה לַמַּסְלוּל ←</button><button class="secondary" data-action="retry" data-id="${l.id}">מְתַרְגְּלִים שׁוּב</button></div></section><div class="category-results" style="grid-template-columns:repeat(${Object.keys(result.categories).length},1fr)">${Object.entries(result.categories).map(([c,r])=>`<div class="category-result">${labels[c]}<b>${r.correct} / ${r.total}</b></div>`).join('')}</div><section class="panel"><h2>מְבִינִים אֶת הַדֶּרֶךְ, לֹא רַק אֶת הַתְּשׁוּבָה</h2><p class="lead">בַּחֲרוּ שְׁאֵלָה אַחַת שֶׁהָיְתָה מְאַתְגֶּרֶת, וְקִרְאוּ יַחַד אֶת הַהֶסְבֵּר.</p>${reviewItems(l,result.answers)}</section>`);}
function progress(){shell(`<h1 class="page-title">כָּל צַעַד נִשְׁמָר</h1><p class="lead">הַהִתְקַדְּמוּת נִשְׁמֶרֶת בַּדַּפְדְּפָן וּבַמַּכְשִׁיר הַזֶּה בִּלְבַד. אֵין צֹרֶךְ בְּחֶשְׁבּוֹן.</p>${!state.history.length?'<div class="empty-state">הַמַּסָּע עוֹד לְפָנֵינוּ ✦<p>אַחֲרֵי הַתִּרְגּוּל הָרִאשׁוֹן, הַתּוֹצָאוֹת יוֹפִיעוּ כָּאן.</p><button class="primary" data-action="home">לִבְחִירַת יְחִידָה ←</button></div>':`<div class="panel">${state.history.toReversed().map((h,i)=>`<article class="review-item"><div class="section-head" style="margin:0"><div><h3>${esc(lessons.find(l=>l.id===h.lessonId).title)}</h3><p>${new Date(h.at).toLocaleDateString('he-IL')} · ${h.mode==='timed'?'תִּרְגּוּל עִם שָׁעוֹן':'לְלֹא שָׁעוֹן'}${h.expired?' · הַזְּמַן הִסְתַּיֵּם':''}</p></div><strong>${h.correct} / ${h.total}</strong></div>${h.answers?`<button class="text-btn" data-action="history" data-value="${state.history.length-1-i}">לִצְפִיָּה בַּתְּשׁוּבוֹת וּבַהֶסְבֵּרִים</button>`:''}</article>`).join('')}</div><button class="text-btn no-print" data-action="clear">מְחִיקַת הַהִיסְטוֹרְיָה מֵהַמַּכְשִׁיר</button>`}`);}
function worksheet(){const l=selected;shell(`<div class="no-print"><h1 class="page-title">דַּף הָעֲבוֹדָה שֶׁלָּךְ מוּכָן</h1><p class="lead">אֶפְשָׁר לְהַדְפִּיס אוֹ לִשְׁמוֹר כְּ־PDF דֶּרֶךְ חַלּוֹן הַהַדְפָּסָה. מַפְתֵּחַ הַתְּשׁוּבוֹת יֻצַּג בְּעַמּוּד נִפְרָד רַק אִם תִּבְחֲרוּ לִכְלֹל אוֹתוֹ.</p><label><input type="checkbox" id="with-answers"> לִכְלֹל מַפְתֵּחַ תְּשׁוּבוֹת וְהֶסְבֵּרִים לַמְּלַוֶּה</label><div class="actions" style="margin:20px 0"><button class="primary" data-action="print">הַדְפָּסָה / שְׁמִירָה כְּ־PDF</button><button class="secondary" data-action="back-setup">בַּחֲזָרָה לַיְּחִידָה</button></div></div><div class="print-header"><h1>אֲמִיקָה · ${esc(l.title)}</h1><p>שֵׁם: ____________ תַּאֲרִיךְ: ____________</p><p>${l.questions.length} שְׁאֵלוֹת · ${l.minutes} דַּקּוֹת תִּרְגּוּל מֻמְלָצוֹת (לֹא זְמַן רִשְׁמִי). סַמְּנוּ תְּשׁוּבָה אַחַת לְכָל שְׁאֵלָה.</p></div><section class="panel">${l.questions.map((q,i)=>`<article class="review-item">${q.passage&&(i===0||q.passage!==l.questions[i-1].passage)?`<div class="passage">${esc(q.passage)}</div>`:''}<h3 class="math">${i+1}. ${mathText(q.prompt)}</h3><div class="print-options">${q.options.map((o,j)=>`<span class="math">${'אבגד'[j]}. ${mathText(o)}</span>`).join('')}</div></article>`).join('')}</section><section id="print-answers" class="print-answers" hidden><h2>מַפְתֵּחַ תְּשׁוּבוֹת · לַמְּלַוֶּה</h2>${l.questions.map((q,i)=>`<article class="review-item"><strong>${i+1}. ${'אבגד'[q.answer]} — ${mathText(q.options[q.answer])}</strong><p class="math">${mathText(q.explanation)}</p></article>`).join('')}</section>`);}
function sources(){shell(`<h1 class="page-title">מֵאֲחוֹרֵי כָּל שְׁאֵלָה יֵשׁ מַחֲשָׁבָה</h1><p class="lead">הַתַּרְגִּילִים וְהַסִּפּוּרִים בָּאֲתָר נִכְתְּבוּ בִּמְיֻחָד עֲבוּר הַמַּסְלוּל. הַמִּבְנֶה מְבֻסָּס עַל עִיּוּן בַּדֻּגְמָאוֹת שֶׁל שְׁלַב א׳ לְכִתָּה ב׳, וְלֹא עַל הַעְתָּקַת שְׁאֵלוֹת. הַקֹּשִׁי מְדֹרָג לְפִי הַעֲרָכָה פֵּדָגוֹגִית, לְלֹא כִּיּוּל פְּסִיכוֹמֶטְרִי.</p><section class="panel"><h2>מָה מָצָאנוּ בַּדֻּגְמָאוֹת?</h2><p class="lead">בְּדֻגְמַת תשפ״ה שֶׁנִּבְדְּקָה: 12 שְׁאֵלוֹת הֲבָנַת הַנִּקְרָא עַל שְׁנֵי טֶקְסְטִים וְ־14 שְׁאֵלוֹת חֶשְׁבּוֹן. בְּחֶשְׁבּוֹן מוֹפִיעִים חִשּׁוּבִים, מִסְפָּר חָסֵר וְאִי־שִׁוְיוֹנִים, בְּעָיוֹת מִלּוּלִיּוֹת וְחִידוֹת בְּצִיּוּרִים. זֶהוּ מִבְנֶה שֶׁל דֻּגְמָה מְסֻיֶּמֶת; יִתָּכְנוּ סוּגֵי שְׁאֵלוֹת נוֹסָפִים.</p><div class="notice">הַגִּישָׁה הַיְּשִׁירָה לָאֲתָרִים הַיִּשְׂרְאֵלִיִּים נֶחְסְמָה בִּסְבִיבַת הָעֲבוֹדָה. הַקְּבָצִים וְהַתַּמְלִילִים נִקְרְאוּ דֶּרֶךְ מַרְאַת GitHub צִבּוּרִית. לֹא אֻמַּת שֶׁהֵם זֵהִים לַפִּרְסוּם הָעַדְכָּנִי בָּאֲתָר הַמִּשְׂרָד, וְלֹא אֻמַּת מֶשֶׁךְ רִשְׁמִי בְּדַקּוֹת.</div><ul class="research-list"><li><a href="https://meyda.education.gov.il/files/Rama/gifted-students-heb-2025.pdf" target="_blank" rel="noopener noreferrer">מִבְחָן סִנּוּן כִּתָּה ב׳ תשפ״ה — מִשְׂרַד הַחִנּוּךְ</a> · PDF, ‏13 עַמּוּדִים; נִקְרָא דֶּרֶךְ הַמַּרְאָה.</li><li><a href="https://meyda.education.gov.il/files/Rama/mechvan-gifted-students-heb-2025.pdf" target="_blank" rel="noopener noreferrer">מַחְוָן תשפ״ה</a> · PDF, ‏4 עַמּוּדִים; נִקְרָא דֶּרֶךְ הַמַּרְאָה.</li><li><a href="https://meyda.education.gov.il/files/gifted/sinun_b-c_example_heb.pdf" target="_blank" rel="noopener noreferrer">דֻּגְמָאוֹת רִשְׁמִיּוֹת לִשְׁלַב א׳</a> · PDF, ‏5 עַמּוּדִים; נִקְרָא דֶּרֶךְ הַמַּרְאָה.</li><li><a href="https://www.machon-noam.co.il/מחוננים-שלב-א" target="_blank" rel="noopener noreferrer">מָכוֹן נֹעַם</a> · PDF דֻּגְמָה בֶּן 10 עַמּוּדִים דֶּרֶךְ הַמַּרְאָה.</li><li><a href="https://gaonchik.co.il/category/samp %A9%D7%82%D6%B4%D7%99%D7%9B%D6%BC%D7%95%D6%BC%D7%9C%20%D7%A1%D6%B0%D7%A4%D6%B8%D7%A8%D7%95%D6%B9%D7%AA**%20(%D7%9C%D6%B0%D7%9E%D6%B8%D7%A9%D7%81%D6%B8%D7%9C%20%D7%94%D6%B7%D7%97%D6%B0%D7%9C%D6%B8%D7%A4%D6%B7%D7%AA%20%D7%A1%D6%B5%D7%93%D6%B6%D7%A8%20%D7%A1%D6%B0%D7%A4%D6%B8%D7%A8%D7%95%D6%B9%D7%AA)%20%D7%9E%D6%B0%D7%A7%D6%B7%D7%91%D6%BC%D6%B5%D7%9C%20%D7%90%D6%B6%D7%A4%D6%B6%D7%A1.%20%D7%91%D6%BC%D6%B0%D6%BEREADME%20%D7%A9%D7%81%D6%B6%D7%9C%20%D7%94%D6%B7%D7%9E%D6%BC%D6%B7%D7%A8%D6%B0%D7%90%D6%B8%D7%94%20%D7%A0%D6%B4%D7%9E%D6%B0%D7%A6%D6%B0%D7%90%D6%B8%D7%94%20%D7%98%D6%B7%D7%A2%D6%B2%D7%A0%D6%B8%D7%94%20%D7%94%D6%B2%D7%A4%D7%95%D6%BC%D7%9B%D6%B8%D7%94%20%D7%9C%D6%B0%D7%92%D6%B7%D7%91%D6%BC%D6%B5%D7%99%20%D7%A9%D7%82%D6%B4%D7%99%D7%9B%D6%BC%D7%95%D6%BC%D7%9C%20%D7%A1%D6%B0%D7%A4%D6%B8%D7%A8%D7%95%D6%B9%D7%AA%3B%20%D7%90%D6%B5%D7%99%D7%9F%20%D7%9C%D6%B0%D7%94%D6%B4%D7%A1%D6%B0%D7%AA%D6%BC%D6%B7%D7%9E%D6%BC%D6%B5%D7%9A%D6%B0%20%D7%A2%D6%B8%D7%9C%D6%B6%D7%99%D7%94%D6%B8.%20%D7%91%D6%BC%D6%B8%D7%90%D6%B2%D7%AA%D6%B8%D7%A8%20%D7%A9%D7%81%D6%B6%D7%9C%D6%BC%D6%B8%D7%A0%D7%95%D6%BC%20%D7%99%D6%B5%D7%A9%D7%81%20%D7%9C%D6%B0%D7%94%D6%B7%D7%92%D6%B0%D7%93%D6%BC%D6%B4%D7%99%D7%A8%20%D7%A0%D6%B4%D7%99%D7%A7%D6%BC%D7%95%D6%BC%D7%93%20%D7%9C%D6%B4%D7%AA%D6%B0%D7%A9%D7%81%D7%95%D6%BC%D7%91%D7%95%D6%B9%D7%AA%20%D7%9E%D6%B0%D7%A7%D7%95%D6%BC%D7%95%D6%B8%D7%A0%D7%95%D6%B9%D7%AA%20%D7%95%D6%BC%D7%9C%D6%B0%D7%93%D6%B7%D7%95%D6%BC%D6%B5%D7%97%D6%B7%20%D7%91%D6%BC%D6%B0%D7%A0%D6%B4%D7%A4%D6%B0%D7%A8%D6%B8%D7%93%20%D7%A2%D6%B7%D7%9C%20%D7%A4%D6%BC%D6%B0%D7%A8%D6%B4%D7%99%D7%98%D6%B4%D7%99%D7%9D%20%D7%A9%D7%81%D6%B6%D7%9C%D6%BC%D6%B9%D7%90%20%D7%A0%D6%B6%D7%A2%D6%B1%D7%A0%D7%95%D6%BC%2C%20%D7%9C%D6%B0%D7%9C%D6%B9%D7%90%20%D7%A9%D7%81%D6%B4%D7%99%D7%9E%D6%BC%D7%95%D6%BC%D7%A9%D7%81%20%D7%91%D6%BC%D6%B7%D7%A6%D6%BC%D6%B4%D7%99%D6%BC%D7%95%D6%BC%D7%9F%20%D7%9B%D6%BC%D6%B0%D7%AA%D6%B7%D7%97%D6%B2%D7%96%D6%B4%D7%99%D7%AA%20%D7%9E%D6%B7%D7%A2%D6%B2%D7%91%D6%B8%D7%A8%20%D7%90%D7%95%D6%B9%20%D7%90%D6%B4%D7%91%D6%B0%D7%97%D7%95%D6%BC%D7%9F.%0A" target="_blank" rel="noopener">לִקְרִיאַת דּוּחַ הַמֶּחְקָר הַמָּלֵא ←</a></section><section class="panel"><h2>הַמּוֹדֶל שֶׁמַּנְחֶה אֶת הַתַּרְגִּילִים</h2><div class="guide-grid"><div><strong>קוֹרְאִים וּמוֹצְאִים רְאָיוֹת</strong><p>מֵאִתּוּר מֵידָע מְפֹרָשׁ, דֶּרֶךְ פֵּרוּשׁ מִלָּה בְּהֶקְשֵׁר וְזִהוּי אִזְכּוּרִים, וְעַד חִבּוּר פְּרָטִים וְהַסָּקָה. לְכָל תְּשׁוּבָה יֵשׁ רְאָיָה בַּטֶּקְסְט.</p></div><div><strong>מְתַרְגְּמִים סִפּוּר לְחֶשְׁבּוֹן</strong><p>מֵחִשּׁוּב יָשִׁיר לְמִסְפָּר חָסֵר, בְּחִירַת פְּעֻלָּה, הַשְׁוָאָה וְחִידוֹת סְמָלִים. כָּל סֵמֶל שׁוֹמֵר עַל אוֹתוֹ עֵרֶךְ בְּתוֹךְ הַשְּׁאֵלָה.</p></div><div><strong>מַעֲלִים קֹשִׁי בְּהַדְרָגָה</strong><p>טֶקְסְטִים אֲרוּכִּים יוֹתֵר, מַסִּיחִים קְרוֹבִים יוֹתֵר וְיוֹתֵר שְׁלַבֵּי פִּתְרוֹן. הַקֹּשִׁי אֵינוֹ עוֹלֶה רַק בְּאֶמְצָעוּת קִצּוּר הַזְּמַן.</p></div><div><strong>בּוֹדְקִים וְלוֹמְדִים</strong><p>אַרְבַּע אֶפְשָׁרוּיוֹת וּתְשׁוּבָה נְכוֹנָה אַחַת. פִּתְרוֹנוֹת נֶחְשָׂפִים בַּסִּיּוּם. כָּל תְּשׁוּבָה נְכוֹנָה שָׁוָה נְקֻדָּה; תְּשׁוּבָה שְׁגוּיָה אוֹ רֵיקָה אֵינָהּ מְקַבֶּלֶת נְקֻדָּה.</p></div></div><p class="lead">הַיְּחִידוֹת הַקְּצָרוֹת הֵן תִּרְגּוּל מְקֻצָּר. הַתִּרְגּוּל בֶּן 26 הַשְּׁאֵלוֹת תּוֹאֵם אֶת אוֹרֶךְ הַדֻּגְמָה שֶׁנִּבְדְּקָה, אַךְ גַּם בּוֹ כָּל הַשְּׁאֵלוֹת הֻתְאֲמוּ לְרַב־בְּרֵרָה. זְמַנֵּי הַתִּרְגּוּל הֵם הַמְלָצָה שֶׁלָּנוּ, וְאֵינָם מֶשֶׁךְ הַמִּבְחָן הָרִשְׁמִי. אֵין כָּאן תַּחֲזִית מַעֲבָר אוֹ אִבְחוּן.</p></section>`);}
function method(){shell(`<h1 class="page-title">לוֹמְדִים לַחֲשׁוֹב, צַעַד אַחַר צַעַד</h1><p class="lead">כָּל יְחִידָה הִיא שִׁעוּר קָטָן: פְּתִיחָה מְשֻׁתֶּפֶת, תִּרְגּוּל עַצְמָאִי וְשִׂיחָה עַל הַדֶּרֶךְ.</p><section class="panel"><ol class="research-list"><li><strong>מַתְחִילִים מֵהֶכֵּרוּת.</strong> מֻמְלָץ לְהִתְקַדֵּם לְפִי הַסֵּדֶר, אַךְ כָּל הַיְּחִידוֹת פְּתוּחוֹת וְאֶפְשָׁר לִבְחוֹר לְפִי הַצֹּרֶךְ.</li><li><strong>לוֹמְדִים בְּנַחַת.</strong> מַתְחִילִים לְלֹא שָׁעוֹן. קוֹרְאִים אֶת כָּל הָאֶפְשָׁרוּיוֹת וּמְחַפְּשִׂים הוֹכָחָה בַּטֶּקְסְט אוֹ בְּחִשּׁוּב.</li><li><strong>מְתַרְגְּלִים עַצְמָאוּת.</strong> אֶפְשָׁר לְדַלֵּג וְלַחֲזוֹר. אֵין צֹרֶךְ לַעֲנוֹת לְפִי סֵדֶר הַשְּׁאֵלוֹת.</li><li><strong>מוֹסִיפִים שָׁעוֹן כְּשֶׁמּוּכָנִים.</strong> הַזְּמַן מֻמְלָץ לְתִרְגּוּל שֶׁלָּנוּ בִּלְבַד. הַשָּׁעוֹן מַמְשִׁיךְ גַּם כְּשֶׁסּוֹגְרִים אֶת הָעַמּוּד, וְהַתִּרְגּוּל נִבְדָּק אוֹטוֹמָטִית כְּשֶׁהַזְּמַן נִגְמָר.</li><li><strong>בּוֹדְקִים יַחַד.</strong> קוֹרְאִים אֶת הַהֶסְבֵּרִים וּבוֹחֲרִים אֶסְטְרָטֶגְיָה אַחַת לַשִּׁעוּר הַבָּא. הַצִּיּוּן נוֹעַד לִלְמִידָה.</li></ol><button class="primary" data-action="home">לַמַּסְלוּל הַלְּמִידָה ←</button></section>`);}
function confirmBox(title,text,onConfirm){document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.innerHTML=`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="actions"><button class="primary" id="confirm-yes">כֵּן, מַמְשִׁיכִים</button><button class="secondary" id="confirm-no">בִּטּוּל</button></div>`;app.append(d);d.querySelector('#confirm-yes').onclick=()=>{d.close();d.remove();onConfirm();};d.querySelector('#confirm-no').onclick=()=>{d.close();d.remove();};d.addEventListener('cancel',()=>d.remove());d.showModal();}
function render(scroll=true){clearInterval(timer);timer=null;({home,setup,session,result:results,progress,sources,method,print:worksheet}[view]||home)();if(scroll){window.scrollTo(0,0);document.querySelector('#main')?.focus({preventScroll:true});}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;const s=state.session;
 if(['home','sources','progress','method'].includes(a)){view=a;render();return;}
 if(a==='first'||a==='lesson'||a==='retry'){selected=a==='first'?(lessons.find(l=>!state.history.some(h=>h.lessonId===l.id))||lessons[0]):lessons.find(l=>l.id===b.dataset.id);view='setup';render();}
 if(a==='mode'){mode=b.dataset.mode;render(false);}
 if(a==='start')start();
 if(a==='resume'){view='session';render();}
 if(a==='leave'){save();view='home';render();}
 if(a==='answer'&&s){if(s.mode==='timed'&&remainingSeconds(s.deadline)===0){finish(true);return;}const l=lessons.find(l=>l.id===s.lessonId);s.answers[l.questions[s.index].id]=Number(b.dataset.value);save();render(false);document.querySelector(`[data-action="answer"][data-value="${b.dataset.value}"]`)?.focus({preventScroll:true});}
 if(['previous','next','jump'].includes(a)&&s){const l=lessons.find(l=>l.id===s.lessonId);s.index=a==='jump'?Number(b.dataset.value):s.index+(a==='next'?1:-1);s.index=Math.max(0,Math.min(l.questions.length-1,s.index));save();render();document.querySelector('#question-title')?.focus({preventScroll:true});}
 if(a==='submit'&&s){const l=lessons.find(l=>l.id===s.lessonId),n=l.questions.length-Object.keys(s.answers).length;confirmBox('לְסַיֵּם וְלִבְדּוֹק אֶת הַתִּרְגּוּל?',n?`נוֹתְרוּ ${n} שְׁאֵלוֹת לְלֹא תְּשׁוּבָה. אֶפְשָׁר לַחֲזוֹר אֲלֵיהֶן אוֹ לְסַיֵּם עַכְשָׁיו.`:'עָנִית עַל כָּל הַשְּׁאֵלוֹת. נִפְתַּח יַחַד אֶת הַתְּשׁוּבוֹת וְהַהֶסְבֵּרִים?',()=>finish());}
 if(a==='worksheet'){view='print';render();}
 if(a==='back-setup'){view='setup';render();}
 if(a==='print'){document.querySelector('#print-answers').hidden=!document.querySelector('#with-answers').checked;window.print();}
 if(a==='clear')confirmBox('לִמְחוֹק אֶת הִיסְטוֹרְיַת הַתִּרְגּוּל?','הַמְּחִיקָה חָלָה עַל הַמַּכְשִׁיר הַזֶּה וְלֹא נִתָּן לְבַטֵּל אוֹתָהּ. תִּרְגּוּל שֶׁטֶּרֶם הֻגַּשׁ לֹא יִמָּחֵק.',()=>{state.history=[];save();render();});
 if(a==='history'){const h=state.history[Number(b.dataset.value)],l=lessons.find(l=>l.id===h.lessonId);result={...h,...grade(l.questions,h.answers),unanswered:l.questions.length-Object.keys(h.answers).length};view='result';render();}
});
render();
</script></body>
